<header>
	<h1 class="header-title">
		<a href="{{prefix}}index.html">
			<span>Design<br />Education</span>
			<svg
				class="title-graphic"
				viewBox="0 0 100 100"
				preserveAspectRatio="none"
				aria-hidden="true"
				focusable="false"
			>
				<path d="M0,0 L100,100" />
				<path d="M100,0 L0,100" />
			</svg>
			<span>AI <br />series</span>
		</a>
	</h1>
	<button
		class="menu-toggle"
		type="button"
		aria-expanded="false"
		aria-controls="site-nav"
		aria-label="Menu"
	>
		<span></span>
		<span></span>
		<span></span>
	</button>
	<nav id="site-nav">
		<ul>
			<li><a href="{{prefix}}about.html">About</a></li>
			<li><a href="{{prefix}}organization.html">Organization</a></li>
			<li>
				<a href="https://designandai.nl/" target="_blank"
					>Design & AI Symposium</a
				>
			</li>
		</ul>
	</nav>
	<script>
		document.querySelector('.menu-toggle').addEventListener('click', (e) => {
			const open = e.currentTarget.getAttribute('aria-expanded') !== 'true';
			e.currentTarget.setAttribute('aria-expanded', open);
			e.currentTarget.closest('header').classList.toggle('menu-open', open);
		});
	</script>
</header>
